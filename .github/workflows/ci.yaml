name: CI

# Every push and pull request: unit tests, lint, integration tests against
# Postgres, the Helm chart and the image build. Pushes to main also publish
# the image (tags main, sha-<sha>) and the chart version 0.0.0-main, whose
# appVersion pins that exact image. Deployments pull that channel; this
# repository never deploys anything itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -count=1 ./...

  lint:
    name: Lint and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Compiled stylesheet and editor bundle match their sources
        run: |
          npm ci --no-audit --no-fund
          npm run css
          npm run js
          git diff --exit-code -- internal/web/static/app.css internal/web/static/editor.js
      - name: Every hand-written Go file has an SPDX header
        run: |
          files=$(grep -L '^// Code generated .* DO NOT EDIT.$' $(git ls-files '*.go') || true)
          missing=$(grep -LE 'SPDX-License-Identifier: (AGPL-3.0-or-later|Apache-2.0)' $files || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header:"; echo "$missing"; exit 1; fi

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: araldo
          POSTGRES_PASSWORD: araldo
          POSTGRES_DB: araldo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U araldo" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      ARALDO_TEST_DSN: postgres://araldo:araldo@localhost:5432/araldo?sslmode=disable&pool_max_conns=4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -tags=integration
        run: go test -tags=integration -race -count=1 ./...
      # Tests never clean up; a second run proves they pass on a database
      # full of earlier runs' data.
      - name: go test -tags=integration (again, on the now-dirty database)
        run: go test -tags=integration -count=1 ./...

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and render every CI values file
        working-directory: deploy/helm/araldo
        run: |
          for f in ci/*-values.yaml; do
            echo "== $f"
            helm lint --strict . -f "$f"
            helm template araldo . -f "$f" > /dev/null
          done
          if helm template araldo . >/dev/null 2>&1; then echo "rendered without a secret"; exit 1; fi

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /tmp/out/ ./cmd/...
          done

  publish:
    name: Publish image and chart
    needs: [test, lint, integration, helm, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=main-${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:main
            ${{ env.REGISTRY }}/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/setup-helm@v5
      - name: Package and push the chart (moving 0.0.0-main, pinned to this image)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/araldo --version 0.0.0-main --app-version "sha-${{ github.sha }}" --destination dist
          helm push dist/araldo-0.0.0-main.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  notify:
    name: Discord on failure
    needs: [test, lint, vulncheck, integration, helm, build, publish]
    if: ${{ failure() && github.event_name == 'push' }}
    uses: spectrum-labs-tech/.github/.github/workflows/discord-cicd-notify.yaml@main
    secrets: inherit
