name: Release

# Push a tag like v0.1.0 to publish binaries, a multi-arch image
# (0.1.0, 0.1) and the chart version 0.1.0 to GHCR.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            out="build/araldo_${VERSION}_${os}_${arch}"
            mkdir -p "$out"
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/spectrum-labs-tech/araldo/internal/buildinfo.Version=${VERSION}" \
              -o "$out/" ./cmd/araldo
            cp LICENSE README.md "$out/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$(basename "$out").zip" "$(basename "$out")")
            else
              tar -C build -czf "dist/$(basename "$out").tar.gz" "$(basename "$out")"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ github.ref_name }}" in v0.*|*-*) prerelease="--prerelease";; esac
          gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes $prerelease

  image-and-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: azure/setup-helm@v4
      - name: Package and push the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/araldo --version "$version" --app-version "$version" --destination dist
          helm push "dist/araldo-${version}.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  notify:
    needs: [binaries, image-and-chart]
    if: ${{ failure() }}
    uses: spectrum-labs-tech/.github/.github/workflows/discord-cicd-notify.yaml@main
    secrets: inherit
