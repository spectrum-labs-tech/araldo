{{- $secret := required "existingSecret is required: a Secret with ARALDO_DATABASE_URL and ARALDO_MASTER_KEYS" .Values.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "araldo.fullname" . }}-server
  labels:
    {{- include "araldo.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "araldo.selector" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "araldo.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "araldo.serviceAccountName" . }}
      {{- include "araldo.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "araldo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["server"]
          ports:
            - { name: http, containerPort: 8080 }
            {{- include "araldo.metricsPort" . | nindent 12 }}
          env:
            {{- include "araldo.metricsEnv" . | nindent 12 }}
            {{- include "araldo.transitEnv" . | nindent 12 }}
            {{- include "araldo.env" . | nindent 12 }}
          envFrom:
            - secretRef: { name: {{ $secret }} }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 60
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          {{- with include "araldo.transitMount" . }}
          volumeMounts: {{ . | nindent 12 }}
          {{- end }}
          {{- include "araldo.containerSecurity" . | nindent 10 }}
      {{- with include "araldo.transitVolume" . }}
      volumes: {{ . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
