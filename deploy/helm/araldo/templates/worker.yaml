{{- if .Values.worker.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "araldo.fullname" . }}-worker
  labels:
    {{- include "araldo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "araldo.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "araldo.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "araldo.serviceAccountName" . }}
      {{- include "araldo.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "araldo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- if .Values.metrics.enabled }}
          ports:
            {{- include "araldo.metricsPort" . | nindent 12 }}
          {{- end }}
          env:
            {{- include "araldo.metricsEnv" . | nindent 12 }}
            {{- include "araldo.transitEnv" . | nindent 12 }}
            {{- include "araldo.env" . | nindent 12 }}
          envFrom:
            - secretRef: { name: {{ required "existingSecret is required" .Values.existingSecret }} }
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          {{- with include "araldo.transitMount" . }}
          volumeMounts: {{ . | nindent 12 }}
          {{- end }}
          {{- include "araldo.containerSecurity" . | nindent 10 }}
      {{- with include "araldo.transitVolume" . }}
      volumes: {{ . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
