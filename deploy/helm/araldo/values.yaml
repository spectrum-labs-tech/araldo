# Araldo Helm values. Secrets never go here: point existingSecret at a
# Secret holding ARALDO_DATABASE_URL and ARALDO_MASTER_KEYS, or use transit
# for the master key (ADR 0008).

image:
  repository: ghcr.io/spectrum-labs-tech/araldo
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Required: a Secret with ARALDO_DATABASE_URL and ARALDO_MASTER_KEYS (unless
# transit holds the master key), and any other ARALDO_* secrets. Its keys
# become environment variables.
existingSecret: ""

config:
  # The public URL people and platforms reach (required).
  baseURL: ""
  logLevel: info
  # A trusted proxy header with the client IP, e.g. CF-Connecting-IP.
  clientIPHeader: ""
  # Non-public addresses platform adapters may reach, e.g. a Mastodon on your LAN: false, true
  # (every one but link-local), or a comma-separated list such as "192.168.1.20,10.8.0.0/16".
  allowPrivateNetworks: false
  # The same for webhook deliveries and media fetched by URL. Every org chooses those URLs, so
  # name only the hosts webhooks need, if any.
  allowPrivateWebhooks: false

# Keep the master key in OpenBao or Vault Transit rather than in existingSecret (ADR 0008; see
# docs/operations.md, "Master keys in Transit"). Transit wraps and unwraps data keys; the master key
# never leaves it. With a role, the pods log in with a projected ServiceAccount token (Kubernetes or
# JWT auth); without one, put ARALDO_TRANSIT_TOKEN in existingSecret.
transit:
  enabled: false
  # The server, e.g. http://openbao.openbao.svc:8200.
  addr: ""
  # The Transit key's name, and the engine's mount.
  key: ""
  mount: transit
  # The auth role the pods log in as, and the auth method's mount.
  role: ""
  authPath: kubernetes
  # The audience the projected token is minted for: the role's bound audience.
  audience: openbao
  tokenExpirationSeconds: 3600

# The pods' ServiceAccount. Create one when a Transit role is bound to it, so no other workload in
# the namespace shares its identity.
serviceAccount:
  create: false
  # Defaults to the release's full name when created, else the namespace's default account.
  name: ""

# Database migrations.
migrations:
  # true: a pre-install/pre-upgrade hook Job runs `araldo migrate` before the Deployments change, and a
  # failed migration stops the upgrade with the old pods still serving. The pods do not migrate.
  # false: both roles migrate at startup instead (golang-migrate serializes them); use this when the
  # chart is rendered without Helm hooks, e.g. `helm template | kubectl apply`.
  job: true
  timeoutSeconds: 600
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { memory: 192Mi }

# Extra environment variables for both roles.
extraEnv: []

server:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

worker:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { memory: 192Mi }

service:
  type: ClusterIP
  port: 8080

# Metrics and alerts (OpenTelemetry, ADR 0014; see docs/operations.md, "Metrics"). All off by default.
metrics:
  # Serve Prometheus metrics from the server and worker pods (OTEL_METRICS_EXPORTER=prometheus) on
  # their own port, apart from the public HTTP port. Database-wide gauges (targets by status, task
  # health) come from every pod alike: aggregate them with max, not sum.
  enabled: false
  port: 9464
  # A monitoring.coreos.com/v1 PodMonitor scraping both roles (needs the Prometheus Operator CRDs).
  podMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. the ones your Prometheus selects PodMonitors by.
    labels: {}
  # A monitoring.coreos.com/v1 PrometheusRule with Araldo's alerts.
  prometheusRule:
    enabled: false
    # Extra labels on the PrometheusRule object, e.g. the ones your Prometheus selects rules by.
    labels: {}
    # Labels added to every alert (routing, team), next to each alert's severity.
    alertLabels: {}
    # The dashboard the runbook links point at; defaults to config.baseURL.
    dashboardURL: ""
    # PromQL label matchers that pick this release's series. Default: namespace="<release
    # namespace>", plus job="<namespace>/<fullname>" when the chart's PodMonitor is on.
    selector: ""
    alerts:
      # A live post target is in needs_attention: the platform may or may not have published it.
      postNeedsAttention:
        enabled: true
        for: 5m
        severity: warning
      # Live publish attempts to a provider keep failing (retried, failed or needs_attention; rate
      # limits are not failures).
      publishFailing:
        enabled: true
        for: 15m
        severity: warning
        window: 30m
        minFailures: 3
        # Failed share of that provider's live attempts in the window.
        ratio: 0.5
      # Live targets are due but nothing claims them, or the worker's tasks stopped succeeding.
      publishingStalled:
        enabled: true
        for: 5m
        severity: critical
        # The oldest claimable live target has been due this long.
        dueSeconds: 900
        # publish.reclaim (every 30s) last succeeded this long ago.
        taskStaleSeconds: 600
      # A background task failed this many times in a row.
      backgroundTaskFailing:
        enabled: true
        for: 5m
        severity: warning
        consecutiveFailures: 3

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
