{{define "content"}}
<h1>Confirm it's you</h1>
<p>This action needs your password{{if .User.MFAEnabled}} and a code from your authenticator{{end}}. You won't be asked again for 10 minutes.</p>
<form method="post" action="/confirm" class="stack narrow">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Password <input type="password" name="password" autocomplete="current-password" required autofocus></label>
  {{if .User.MFAEnabled}}<label>Authenticator code <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="24"></label>{{end}}
  <button class="primary">Confirm</button>
</form>
{{end}}
