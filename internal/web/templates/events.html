{{define "content"}}
<h1>Events</h1>
<form method="get" action="/events" class="mb-4 flex flex-wrap items-center gap-2">
  <label class="sr-only" for="type">Type</label>
  <select id="type" name="type" data-autosubmit>
    <option value="">All types</option>
    {{range .Data.Types}}<option value="{{.}}" {{if eq $.Data.Type .}}selected{{end}}>{{.}}</option>{{end}}
  </select>
  <noscript><button>Filter</button></noscript>
</form>
{{if .Data.Events}}
<table>
  <thead><tr><th>Type</th><th>ID</th><th>When</th></tr></thead>
  <tbody>
  {{range .Data.Events}}
  <tr><td><a href="/events/{{eventID .ID}}"><code>{{.Type}}</code></a></td><td class="text-sm text-muted"><code>{{eventID .ID}}</code></td><td>{{ago .CreatedAt}}</td></tr>
  {{end}}
  </tbody>
</table>
{{if .Data.HasMore}}<p class="mt-3"><a href="/events?type={{.Data.Type}}&after={{.Data.Next}}">Older →</a></p>{{end}}
{{else}}<p class="text-muted">No events.</p>{{end}}
{{end}}
