{{define "content"}}
<h1>Sign in</h1>
<form method="post" action="/login" class="flex flex-col gap-4">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Email <input type="email" name="email" value="{{.Data.Email}}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn-primary">Sign in</button>
</form>
<div data-passkey-area hidden class="mt-4 flex flex-col gap-2">
  <button type="button" data-passkey="login" data-next="{{.Data.Next}}">Sign in with a passkey</button>
  <p class="text-sm" data-passkey-error role="alert"></p>
</div>
<p class="mt-4 text-sm"><a href="/login/sso{{with .Data.Next}}?next={{.}}{{end}}">Sign in with single sign-on</a></p>
{{with .SignupURL}}<p class="mt-4 text-sm">New here? <a href="{{.}}">Create an account</a></p>{{end}}
<p class="mt-4 text-sm text-muted">Forgot your password? Ask your org's owner, or an operator can run <code>araldo admin users reset-password</code>.</p>
{{end}}
