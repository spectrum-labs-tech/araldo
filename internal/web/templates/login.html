{{define "content"}}
<h1>Sign in</h1>
<form method="post" action="/login" class="stack">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Email <input type="email" name="email" value="{{.Data.Email}}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button class="primary">Sign in</button>
</form>
<p class="muted small">Forgot your password? Ask your org's owner, or an operator can run <code>araldo users reset-password</code>.</p>
{{end}}
