{{define "content"}}
<h1>Two-factor authentication</h1>
<p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
<form method="post" action="/login/mfa" class="stack">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="24"></label>
  <button class="primary">Verify</button>
</form>
<p class="small"><a href="/login">Start over</a></p>
{{end}}
