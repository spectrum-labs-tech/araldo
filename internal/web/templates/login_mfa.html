{{define "content"}}
<h1>Two-factor authentication</h1>
<p class="mb-4">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
<form method="post" action="/login/mfa" class="flex flex-col gap-4">
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus maxlength="24"></label>
  <button class="btn-primary">Verify</button>
</form>
<p class="mt-4 text-sm"><a href="/login">Start over</a></p>
{{end}}
