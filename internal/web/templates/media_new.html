{{define "content"}}
{{$d := .Data}}
<p class="crumbs"><a href="/media">Media</a></p>
<h1>Add media</h1>
{{if $d.Added}}<p class="callout">{{$d.Added}} file{{if gt $d.Added 1}}s were{{else}} was{{end}} added to the library; only the link is left to fix.</p>{{end}}
<form method="post" action="/media" enctype="multipart/form-data" class="form-stack">
  <input type="hidden" name="csrf" value="{{$.CSRF}}">
  <label>Brand
    {{template "brandSelect" (brandOptions $d.Brands ($d.Form.Get "brand") "Choose a brand")}}</label>
  <label>Images <input type="file" name="files" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
    <span class="hint">JPEG, PNG, GIF or WebP, up to 16 MiB each.</span></label>
  <label><span>Or fetch an image{{if $d.MaxVideo}} or video{{end}} from a link <span class="hint">(optional)</span></span>
    <input type="url" name="url" value="{{$d.Form.Get "url"}}" placeholder="https://openb00ks.example/logo.png">
    <span class="hint">Araldo fetches it once and keeps its own copy.</span></label>
  <label>Alt text <input name="alt" value="{{$d.Form.Get "alt"}}" maxlength="1000" placeholder="What it shows, for people who cannot see it">
    <span class="hint">For everything added now; change each one's later.</span></label>
  <p class="text-sm text-muted">Media added here is kept until you delete it.</p>
  <div class="controls"><button class="btn-primary">Add</button> <a class="btn" href="/media">Cancel</a></div>
</form>
{{end}}
